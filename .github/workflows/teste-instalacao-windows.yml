# Teste de instalação do ASSIST Suporte numa máquina Windows limpa do GitHub.
# Vive no branch assist/teste-instalacao do fork jeanribas/rdgen (cópia versionada aqui).
# Baixa o que está publicado em rd.assist.com.br, instala (.exe e .msi) e confere o que o
# acesso não supervisionado precisa: serviço rodando, atalho, entrada em Aplicativos,
# senha permanente gravada e ID gerado. O registro no servidor é conferido no hbbs pelo ID.
# Rodar de novo: gh run rerun <id> -R jeanribas/rdgen
name: Teste de instalacao Windows (ASSIST)

on:
  push:
    branches: [assist/teste-instalacao]

permissions:
  contents: read

jobs:
  instalar:
    name: instalar ${{ matrix.tipo }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tipo: [exe, msi]
    steps:
      - name: Baixar instalador publicado e conferir SHA-256
        shell: pwsh
        run: |
          $f = "$env:RUNNER_TEMP\assist-suporte.${{ matrix.tipo }}"
          Invoke-WebRequest "https://rd.assist.com.br/downloads/assist-suporte.${{ matrix.tipo }}" -OutFile $f
          Invoke-WebRequest "https://rd.assist.com.br/downloads/SHA256SUMS" -OutFile "$env:RUNNER_TEMP\SHA256SUMS"
          $linha = Select-String -Path "$env:RUNNER_TEMP\SHA256SUMS" -Pattern "  assist-suporte\.${{ matrix.tipo }}$"
          if (-not $linha) { throw "arquivo fora do SHA256SUMS" }
          $esperado = $linha.Line.Split(' ')[0]
          $real = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          if ($esperado -ne $real) { throw "SHA-256 diferente: $real" }
          "SHA-256 ok: $real"
          $v = (Get-Item $f).VersionInfo
          "ProductName: $($v.ProductName) | FileDescription: $($v.FileDescription) | Version: $($v.ProductVersion)"

      - name: Instalar
        shell: pwsh
        run: |
          $f = "$env:RUNNER_TEMP\assist-suporte.${{ matrix.tipo }}"
          if ("${{ matrix.tipo }}" -eq "msi") {
            $p = Start-Process msiexec -ArgumentList "/i `"$f`" /qn /norestart /l*v `"$env:RUNNER_TEMP\msi.log`"" -Wait -PassThru
            "msiexec terminou com código $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\msi.log" -Tail 80; throw "MSI falhou" }
          } else {
            Start-Process $f -ArgumentList "--silent-install"
          }
          # A instalação termina em segundo plano; esperar o serviço aparecer (até 4 min).
          $limite = (Get-Date).AddMinutes(4)
          do {
            Start-Sleep 5
            $svc = Get-Service | Where-Object { $_.Name -like "*Suporte*" -or $_.DisplayName -like "*Suporte*" }
          } while (-not $svc -and (Get-Date) -lt $limite)
          Start-Sleep 20

      - name: Conferir instalação
        shell: pwsh
        run: |
          $erros = @()
          $dir = Get-ChildItem $env:ProgramFiles -Directory | Where-Object Name -like "*Suporte*" | Select-Object -First 1
          if ($dir) { "pasta: $($dir.FullName)"; Get-ChildItem $dir.FullName -Filter *.exe | ForEach-Object { "  exe: $($_.Name)" } } else { $erros += "pasta em Program Files não criada" }
          $svc = Get-Service | Where-Object { $_.Name -like "*Suporte*" -or $_.DisplayName -like "*Suporte*" }
          if ($svc) { $svc | ForEach-Object { "serviço: $($_.Name) [$($_.DisplayName)] $($_.Status) $($_.StartType)" } } else { $erros += "serviço não criado" }
          if ($svc -and ($svc | Where-Object Status -ne 'Running')) { $erros += "serviço não está rodando" }
          $app = Get-ChildItem HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall, HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall |
            ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -like "*Suporte*" }
          if ($app) { $app | ForEach-Object { "Aplicativos instalados: $($_.DisplayName) $($_.DisplayVersion)" } } else { $erros += "não aparece em Aplicativos instalados" }
          $lnk = @(Get-ChildItem "$env:PUBLIC\Desktop", "$env:ProgramData\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "*Suporte*.lnk" -ErrorAction SilentlyContinue)
          if ($lnk.Count) { $lnk | ForEach-Object { "atalho: $($_.FullName)" } } else { $erros += "nenhum atalho criado" }
          if ($erros) { $erros | ForEach-Object { "::error::$_" }; throw "instalação incompleta" }
          "instalação OK"

      - name: Senha permanente e ID
        shell: pwsh
        run: |
          # Usar exatamente o executável que o serviço roda.
          $svc = Get-CimInstance Win32_Service | Where-Object { $_.Name -like "*Suporte*" } | Select-Object -First 1
          if (-not $svc) { throw "serviço não encontrado" }
          $exe = Get-Item ([regex]::Match($svc.PathName, '^"?([^"]+?\.exe)').Groups[1].Value)
          "executável do serviço: $($exe.FullName)"
          $senha = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 24 | ForEach-Object { [char]$_ })
          "::add-mask::$senha"
          $saida = & $exe.FullName --password $senha 2>&1 | Out-String
          "--password: $($saida.Trim())"
          Start-Sleep 5
          $toml = Get-ChildItem "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming" -Recurse -Filter "*.toml" -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq "config" -and $_.BaseName -notmatch '(2|_local|_default)$' }
          $gravada = $toml | Where-Object { Select-String -Path $_.FullName -Pattern "^password = '.+'" -Quiet }
          if ($gravada) { "senha permanente gravada em $($gravada.FullName)" } else { "::error::senha permanente não gravada"; throw "senha" }
          $id = (& $exe.FullName --get-id 2>&1 | Out-String).Trim()
          "ID: $id"
          # O RustDesk gera IDs numéricos de tamanho variável (8 a 10 dígitos na prática).
          if ($id -notmatch '^\d{6,12}$') { throw "ID inválido" }
          # Dar tempo para o serviço se registrar no servidor (o ID é conferido no hbbs).
          Start-Sleep 60

      - name: Print da janela do app
        if: matrix.tipo == 'exe'
        shell: pwsh
        run: |
          $svc = Get-CimInstance Win32_Service | Where-Object { $_.Name -like "*Suporte*" } | Select-Object -First 1
          $exe = [regex]::Match($svc.PathName, '^"?([^"]+?\.exe)').Groups[1].Value
          Start-Process $exe
          Start-Sleep 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\tela-app.png")
          "print salvo: $($b.Width)x$($b.Height)"

      - name: Guardar o print
        if: matrix.tipo == 'exe'
        uses: actions/upload-artifact@v4
        with:
          name: tela-app
          path: ${{ runner.temp }}/tela-app.png
          retention-days: 3
